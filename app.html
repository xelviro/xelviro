<!DOCTYPE html>
<html>
<head>
  <title>XELVIRO AI Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0f19;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .top {
      padding: 15px;
      background: #111827;
      text-align: center;
      font-weight: bold;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .msg {
      padding: 10px 14px;
      margin: 10px 0;
      border-radius: 10px;
      max-width: 70%;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .bot {
      background: #1f2937;
    }

    .input {
      display: flex;
      padding: 10px;
      background: #111827;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0b0f19;
      color: white;
    }

    button {
      margin-left: 10px;
      padding: 12px 18px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="top">🤖 XELVIRO AI Chat</div>

<div class="chat" id="chat"></div>

<div class="input">
  <input id="input" placeholder="Ask anything..." />
  <button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");

function add(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  let input = document.getElementById("input");
  let text = input.value;
  if (!text) return;

  add(text, "user");
  input.value = "";

  add("Thinking...", "bot");

  const res = await fetch("https://YOUR-BACKEND-URL/chat", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({message:text})
  });

  const data = await res.json();

  chat.lastChild.innerText = data.reply;
}
</script>

</body>
</html>
